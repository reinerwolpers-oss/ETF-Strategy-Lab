name: ETF Saison Paper-Trading

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/paper_trade.py'
      - 'config/paper-settings.json'
      - '.github/workflows/paper-trading.yml'

permissions:
  contents: write

concurrency:
  group: etf-paper-portfolio
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax and safety mode
        run: |
          python -m py_compile scripts/paper_trade.py
          python -c 'import json; c=json.load(open("config/paper-settings.json")); assert c["mode"]=="PAPER_ONLY" and c["broker_connection"] is False and c["live_orders"] is False'
      - name: Simulate paper portfolio only
        run: python scripts/paper_trade.py
      - name: Persist simulated state
        run: |
          git add data/paper-portfolio.json
          if git diff --cached --quiet; then
            echo "No paper state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update virtual ETF paper portfolio"
          git push
