name: ETF Cooldown 15 30 60 Vergleich (Research Only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cooldown-duration-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cooldown-Sicherheitstest
        run: python -m unittest discover -s tests -p 'test_historical_portfolio_cooldown.py'
      - name: Varianten 15 30 und 60 separat vergleichen
        run: python scripts/cooldown_duration_comparison.py
      - name: Historischen Vergleich speichern
        run: |
          git add data/cooldown-duration-comparison.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update retrospective cooldown-duration comparison"
          git pull --rebase
          git push
