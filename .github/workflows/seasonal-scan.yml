name: Saisonale ETF-Fenster scannen

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/seasonal_scan.py'
      - '.github/workflows/seasonal-scan.yml'

permissions:
  contents: write

concurrency:
  group: seasonal-etf-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Saisonale ETF-Zeitfenster finden
        run: python scripts/seasonal_scan.py
      - name: Geprüfte Ergebnisse speichern
        run: |
          git add data/seasonal-signals.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update seasonal ETF research results"
          git push
