name: ETF Portfolio Backtest 5.0 (Research Only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-portfolio-research
  cancel-in-progress: false

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline-Sicherheitstest
        run: python -m unittest discover -s tests -p 'test_historical_portfolio_50.py'
      - name: Historisches Portfolio separat simulieren
        run: python scripts/historical_portfolio_50.py
      - name: Backtestbericht speichern
        run: |
          git add data/historical-portfolio-50.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update research-only historical portfolio 5.0"
          git pull --rebase
          git push
