name: IBKR 4.7 Read-Only Sicherheitspruefung

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ibkr_readonly_probe.py'
      - 'scripts/ibkr_historical_compare.py'
      - 'tests/test_ibkr_readonly.py'
      - 'tests/test_ibkr_history.py'
      - '.github/workflows/ibkr-readonly-check.yml'

permissions:
  contents: read

jobs:
  safe-static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax validation (no IBKR login)
        run: python -m py_compile scripts/ibkr_readonly_probe.py scripts/ibkr_historical_compare.py
      - name: Offline local-demo security tests
        run: |
          python -m unittest discover -s tests -p 'test_ibkr_readonly.py' -v
          python -m unittest discover -s tests -p 'test_ibkr_history.py' -v
      - name: Verify paper trading broker connection remains disabled
        run: |
          python - <<'PY'
          import json
          c=json.load(open("config/paper-settings.json"))
          assert c["mode"]=="PAPER_ONLY"
          assert c["broker_connection"] is False
          assert c["live_orders"] is False
          print("Live orders disabled; remote broker connection disabled.")
          PY
