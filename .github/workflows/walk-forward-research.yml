name: ETF Walk-Forward Research (nur historische Daten)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-walk-forward-research
  cancel-in-progress: false

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Jedes Testjahr nur mit vorangegangenen Jahren kalibrieren
        run: python scripts/walk_forward_research.py
      - name: Separaten Forschungsbericht speichern
        run: |
          git add data/walk-forward-research.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update expanding-window seasonality research"
          git pull --rebase
          git push
