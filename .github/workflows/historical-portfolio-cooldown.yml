name: ETF Portfolio Cooldown Vergleich (Research Only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-portfolio-cooldown
  cancel-in-progress: false

jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cooldown Offline Sicherheitstest
        run: python -m unittest discover -s tests -p 'test_historical_portfolio_cooldown.py'
      - name: Unveraenderte Originalvariante und 30-Tage-Cooldown in separaten Dateien
        run: python scripts/historical_portfolio_cooldown.py
      - name: Eigenstaendigen Alternativbericht speichern
        run: |
          git add data/historical-portfolio-cooldown.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update research-only cooldown comparison"
          git pull --rebase
          git push
