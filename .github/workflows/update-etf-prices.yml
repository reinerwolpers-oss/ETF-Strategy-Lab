name: ETF-Kursdaten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-etf-prices.yml'
      - 'scripts/update_etf.py'

permissions:
  contents: write

concurrency:
  group: etf-price-refresh
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ETF-Kursdaten laden und validieren
        run: python scripts/update_etf.py

      - name: Nur geprüfte Kursdaten speichern
        run: |
          git add data/etf-prices.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Kursdaten."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ETF historical prices"
          git push
